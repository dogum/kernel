name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Static and fixture checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync_agent_builds.mjs --check
      - run: node tests/verify_agent_v2.mjs
      - run: node tests/verify_agent_v23.mjs
      - run: node tests/verify_agent_v24.mjs
      - run: node tests/verify_examples.mjs

  browser:
    name: Browser end-to-end (desktop + mobile builds)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/e2e/run.mjs
